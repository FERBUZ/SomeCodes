<div class="hero-track" #track><article *ngFor="let movie of movies" class="hero-slide" [style.background-image]="'url(https://image.tmdb.org/t/p/w780'+movie.backdrop_path+')'"><div class="movie-description"><h2>{{movie.title}}</h2><p>{{movie.overview | slice:0:200}}</p></div></article></div><div class="d-flex justify-content-between mt-2"><button class="btn btn-outline-light" (click)="move(-1)">Anterior</button><button class="btn btn-outline-light" (click)="move(1)">Siguiente</button></div>
