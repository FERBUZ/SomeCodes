<div class="row">
    <div class="col-md-3 mb-5 animate__animated animate__headShake" *ngFor="let movie of movies">

        <img [src]="movie.poster_path | poster" class="img-fluid poster" [alt]="movie.title" loading="lazy" (click)="onMovieClick( movie )" (keydown.enter)="onMovieClick(movie)" tabindex="0" role="button">

        <div>
            <h3>{{ movie.title }}</h3>
            <div class="row">
                <div class="col-10 text-white">
                    <span class="text-warning" aria-label="Calificación sobre diez">★ / 10</span>

                </div>
                <div class="col-2 text-white">
                    {{ movie.vote_average | number:'1.1-2' }}
                </div>
            </div>
        </div>

    </div>
</div>
